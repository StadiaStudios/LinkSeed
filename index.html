<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkSeed Mayonaise</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090a0d;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-chassis {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: transparent;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #0b1622;
    }

    #wallpaper-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }

    .screen-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.35) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .pages-viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      overflow: hidden;
      cursor: grab;
      touch-action: pan-y;
    }

    .pages-viewport:active {
      cursor: grabbing;
    }

    .pages-track {
      display: flex;
      height: 100%;
      width: 100%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .home-page {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      padding: 26px 36px 14px 36px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: min-content;
      gap: 26px 18px;
      align-content: start;
    }

    @media (max-width: 768px) {
      .home-page {
        padding: 22px 18px 12px 18px;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px 12px;
      }
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-item:hover {
      transform: scale(1.06);
    }

    .app-item:active {
      transform: scale(0.92);
      filter: brightness(0.82);
    }

    .app-icon-wrap {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 14px;
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.55),
        0 1px 2px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      background-color: #1c222d;
    }

    .app-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    .app-label {
      margin-top: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      line-height: 1.2;
      max-width: 82px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.95),
        0 0 6px rgba(0, 0, 0, 0.75);
    }

    .page-dots {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 8px 0 10px 0;
    }

    .page-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.35);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .page-dot.active {
      background-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    .dock-container {
      position: relative;
      z-index: 20;
      width: 100%;
      margin: 0;
      padding: 12px 24px 14px 24px;
      border-radius: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.34) 0%,
        rgba(210, 220, 235, 0.22) 48%,
        rgba(140, 155, 175, 0.28) 50%,
        rgba(90, 105, 125, 0.38) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow:
        0 -4px 16px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
    }

    @media (max-width: 768px) {
      .dock-container {
        display: flex;
        justify-content: center;
        gap: 24px;
        padding: 10px 14px 14px 14px;
      }
    }

    .dock-container .app-label {
      display: block;
      margin-top: 5px;
    }

    .dock-container .app-icon-wrap {
      width: 58px;
      height: 58px;
    }
  </style>
  <script src="scripts/notch.js" defer></script>
</head>
<body>

  <div class="phone-chassis" id="phone-chassis">
    <div class="phone-screen" id="phone-screen">
      <img id="wallpaper-img" src="assets/wallpaper.png" alt="LinkSeed wallpaper" />
      <div class="screen-vignette"></div>

      <main class="pages-viewport" id="pages-viewport">
        <div class="pages-track" id="pages-track"></div>
      </main>

      <div class="page-dots" id="page-dots"></div>

      <footer class="dock-container" id="dock-container"></footer>
    </div>
  </div>

  <script>
    const APPS_DATA = [
      {
        id: "lifeinvader2",
        name: "Life Invader",
        newTab: false,
        page: 1,
        url: "social.html",
        iconUrl: "assets/platform/life-invader.png",
        colors: ["#e63946", "#8d0801"],
      },
      {
        id: "mayonaise",
        name: "Mayonaise",
        newTab: true,
        page: 1,
        url: "https://yaktenz.github.io/mayonaise.gg",
        iconUrl: "profiles/mayonaise/avatar.png",
        colors: ["#e63946", "#8d0801"],
      },
      {
        id: "youngdollazz",
        name: "YoungDollazz",
        newTab: true,
        page: 1,
        url: "https://yaktenz.github.io/youngdollazz/",
        iconUrl: "https://yaktenz.github.io/youngdollazz/assets/favicon.png",
        colors: ["#f4a261", "#b55309"],
      },
      {
        id: "soundcloud",
        name: "SoundCloud",
        newTab: true,
        page: 1,
        url: "https://soundcloud.com/youngdollazz1700",
        iconUrl: "assets/platform/SoundCloud.png",
        colors: ["#ff8800", "#c44d00"],
      },
      {
        id: "discord",
        name: "Discord",
        newTab: true,
        page: 1,
        url: "https://discord.gg/invite/a7eNTUaYPh",
        iconUrl: "assets/platform/discord.png",
        colors: ["#5865f2", "#404eed"],
      },
      {
        id: "tiktok",
        name: "TikTok",
        newTab: true,
        page: 1,
        url: "https://www.tiktok.com/@glitchtheory_vision",
        iconUrl: "assets/platform/tiktok.png",
        colors: ["#25f4ee", "#fe2c55"],
      },
      {
        id: "youtube",
        name: "YouTube",
        newTab: true,
        page: 1,
        url: "https://www.youtube.com/@TheRealMayo_",
        iconUrl: "assets/platform/youtube.png",
        colors: ["#FF0033", "#FF0000"],
      },
      {
        id: "stadiastudios",
        name: "StadiaStudios",
        newTab: true,
        page: 2,
        url: "https://stadiastudios.github.io/stadia/",
        iconUrl: "https://stadiastudios.github.io/stadia/assets/favicon.png",
        colors: ["#8d99ae", "#2b2d42"],
      },
      {
        id: "passpro",
        name: "PassPro",
        newTab: true,
        page: 2,
        url: "https://stadiastudios.github.io/stadia/store/passpro.html",
        iconUrl: "assets/platform/passpro.png",
        colors: ["#6c63ff", "#302b63"],
      },
      {
        id: "ourjourney",
        name: "Our Journey",
        newTab: true,
        page: 2,
        url: "https://stadiastudios.github.io/ourjourney/splash",
        iconUrl: "https://stadiastudios.github.io/stadia/store/assets/app/ourjourney.png",
        colors: ["#48cae4", "#023e8a"],
      },
      {
        id: "edgebolt",
        name: "EdgeBolt",
        newTab: true,
        page: 3,
        url: "https://edgebolt.vercel.app/",
        iconUrl: "assets/platform/edgebolt.png",
        colors: ["#4cc9f0", "#3a0ca3"],
      },
      {
        id: "ppsspp",
        name: "PPSSPP",
        newTab: true,
        page: 3,
        url: "https://www.ppsspp.org/",
        iconUrl: "assets/platform/PPSSPP.png",
        colors: ["#ff8c42", "#c94c00"],
      }
    ];

    const DOCK_APPS = [
      {
        id: "lifeinvader1",
        name: "Life Invader",
        newTab: false,
        url: "social.html",
        iconUrl: "assets/platform/life-invader.png",
        colors: ["#55a630", "#132a13"],
      },
      {
        id: "soundcloud2",
        name: "SoundCloud",
        newTab: true,
        url: "https://soundcloud.com/youngdollazz1700",
        iconUrl: "assets/platform/SoundCloud.png",
        colors: ["#ff8800", "#c44d00"],
      },
      {
        id: "stadiatoolpanel",
        name: "Stadia Tool Panel",
        newTab: true,
        url: "https://stadiabeta.github.io/tool-panel/",
        iconUrl: "https://stadiastudios.github.io/stadia/store/assets/app/tool-panel.png",
        colors: ["#8d99ae", "#2b2d42"],
      }
    ];

    function generateAppIconPNG(app) {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      const bgGrad = ctx.createLinearGradient(0, 0, 0, size);
      bgGrad.addColorStop(0, app.colors[0]);
      bgGrad.addColorStop(1, app.colors[1]);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, size - 4, size - 4);

      const glossGrad = ctx.createLinearGradient(0, 0, 0, size * 0.55);
      glossGrad.addColorStop(0, "rgba(255, 255, 255, 0.55)");
      glossGrad.addColorStop(1, "rgba(255, 255, 255, 0.08)");
      ctx.fillStyle = glossGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(size, 0);
      ctx.lineTo(size, size * 0.42);
      ctx.quadraticCurveTo(size / 2, size * 0.58, 0, size * 0.42);
      ctx.closePath();
      ctx.fill();

      return canvas.toDataURL("image/png");
    }

    const pagesTrack = document.getElementById("pages-track");
    const pageDots = document.getElementById("page-dots");
    const dockContainer = document.getElementById("dock-container");

    function createAppElement(app) {
      const link = document.createElement("a");
      link.className = "app-item";
      link.href = app.url;
      link.target = app.newTab ? "_blank" : "_self";
      link.rel = app.newTab ? "noopener noreferrer" : "";
      link.title = `Open ${app.name} (${app.url})`;

      link.addEventListener("click", (e) => {
        if (wasDragging) {
          e.preventDefault();
        }
      });

      const iconWrap = document.createElement("div");
      iconWrap.className = "app-icon-wrap";

      const img = document.createElement("img");
      img.className = "app-icon-img";
      img.alt = app.name;
      if (app.iconUrl) {
        img.src = app.iconUrl;
        img.onerror = () => {
          img.onerror = null;
          img.src = generateAppIconPNG(app);
        };
      } else {
        img.src = generateAppIconPNG(app);
      }

      iconWrap.appendChild(img);

      const label = document.createElement("span");
      label.className = "app-label";
      label.textContent = app.name;

      link.appendChild(iconWrap);
      link.appendChild(label);
      return link;
    }

    let currentPage = 0;
    let totalPages = 1;

    function renderHomeScreens() {
      pagesTrack.innerHTML = "";
      pageDots.innerHTML = "";

      const pageNumbers = [...new Set(APPS_DATA.map((app) => app.page))].sort((a, b) => a - b);
      totalPages = Math.max(1, pageNumbers.length);

      for (let p = 0; p < totalPages; p++) {
        const pageNumber = pageNumbers[p];
        const pageDiv = document.createElement("section");
        pageDiv.className = "home-page";
        pageDiv.setAttribute("aria-label", `Home Screen Page ${pageNumber}`);

        APPS_DATA.filter((app) => app.page === pageNumber).forEach((app) => {
          pageDiv.appendChild(createAppElement(app));
        });

        pagesTrack.appendChild(pageDiv);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "page-dot" + (p === 0 ? " active" : "");
        dot.setAttribute("aria-label", `Go to page ${pageNumber}`);
        dot.addEventListener("click", () => goToPage(p));
        pageDots.appendChild(dot);
      }
    }

    function renderDock() {
      dockContainer.innerHTML = "";
      DOCK_APPS.forEach((app) => {
        dockContainer.appendChild(createAppElement(app));
      });
    }

    const viewport = document.getElementById("pages-viewport");
    let isDragging = false;
    let wasDragging = false;
    let startX = 0;
    let startTime = 0;
    let currentX = 0;
    let targetX = 0;
    let dragStartTranslate = 0;
    let rafId = null;

    function renderTrack() {
      const ease = isDragging ? 0.55 : 0.22;
      const diff = targetX - currentX;

      if (Math.abs(diff) > 0.1) {
        currentX += diff * ease;
      } else {
        currentX = targetX;
      }

      pagesTrack.style.transform = `translate3d(${currentX.toFixed(2)}px, 0, 0)`;

      if (isDragging || Math.abs(targetX - currentX) > 0.1) {
        rafId = requestAnimationFrame(renderTrack);
      } else {
        rafId = null;
      }
    }

    function startAnimationLoop() {
      if (!rafId) {
        rafId = requestAnimationFrame(renderTrack);
      }
    }

    function goToPage(pageIndex, instant = false) {
      currentPage = Math.max(0, Math.min(pageIndex, totalPages - 1));
      const width = viewport.clientWidth;
      targetX = -currentPage * width;

      if (instant) {
        currentX = targetX;
        pagesTrack.style.transform = `translate3d(${currentX}px, 0, 0)`;
      } else {
        startAnimationLoop();
      }

      document.querySelectorAll(".page-dot").forEach((dot, idx) => {
        dot.classList.toggle("active", idx === currentPage);
      });
    }

    function onDragStart(clientX) {
      isDragging = true;
      wasDragging = false;
      startX = clientX;
      startTime = performance.now();
      dragStartTranslate = currentX;
      startAnimationLoop();
    }

    function onDragMove(clientX) {
      if (!isDragging) return;
      const diff = clientX - startX;
      if (Math.abs(diff) > 6) {
        wasDragging = true;
      }

      const width = viewport.clientWidth;
      const minX = -(totalPages - 1) * width;
      const maxX = 0;
      let rawTarget = dragStartTranslate + diff;

      if (rawTarget > maxX) {
        rawTarget = maxX + (rawTarget - maxX) * 0.3;
      } else if (rawTarget < minX) {
        rawTarget = minX + (rawTarget - minX) * 0.3;
      }

      targetX = rawTarget;
    }

    function onDragEnd(clientX) {
      if (!isDragging) return;
      isDragging = false;

      const endX = typeof clientX === "number" ? clientX : startX;
      const movedBy = endX - startX;
      const elapsed = Math.max(1, performance.now() - startTime);
      const velocity = Math.abs(movedBy) / elapsed;
      const width = viewport.clientWidth;

      if ((movedBy < -30 && velocity > 0.35) || movedBy < -width * 0.22) {
        if (currentPage < totalPages - 1) currentPage += 1;
      } else if ((movedBy > 30 && velocity > 0.35) || movedBy > width * 0.22) {
        if (currentPage > 0) currentPage -= 1;
      }

      goToPage(currentPage);
      setTimeout(() => { wasDragging = false; }, 40);
    }

    viewport.addEventListener("mousedown", (e) => {
      e.preventDefault();
      onDragStart(e.clientX);
    });
    window.addEventListener("mousemove", (e) => onDragMove(e.clientX));
    window.addEventListener("mouseup", (e) => onDragEnd(e.clientX));

    viewport.addEventListener("touchstart", (e) => onDragStart(e.touches[0].clientX), { passive: true });
    viewport.addEventListener("touchmove", (e) => onDragMove(e.touches[0].clientX), { passive: true });
    viewport.addEventListener("touchend", (e) => {
      const endX = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : startX;
      onDragEnd(endX);
    });

    let wheelLocked = false;
    viewport.addEventListener("wheel", (e) => {
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
      if (Math.abs(delta) > 12 && !wheelLocked) {
        wheelLocked = true;
        if (delta > 0 && currentPage < totalPages - 1) goToPage(currentPage + 1);
        else if (delta < 0 && currentPage > 0) goToPage(currentPage - 1);
        setTimeout(() => { wheelLocked = false; }, 280);
      }
    }, { passive: true });

    window.addEventListener("resize", () => goToPage(currentPage, true));

    window.addEventListener("DOMContentLoaded", () => {
      renderHomeScreens();
      renderDock();
      goToPage(0, true);
    });
  </script>
</body>
</html>
