<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Settings | LinkSeed Mobile App Launcher</title>
  <meta name="theme-color" content="#0d0818" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta name="apple-mobile-web-app-title" content="LinkSeed" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="profiles/mayonaise/avatar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --vice-pink: #f143a2;
      --vice-coral: #ff726a;
      --vice-sunset: #ff9347;
      --vice-purple: #6c43c2;
      --vice-cyan: #00f0ff;
      --glass-bg: rgba(16, 12, 28, 0.72);
      --glass-border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #ffffff;
      background-color: #0b1622;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    #wallpaper-img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }

    .screen-vignette {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(11, 22, 34, 0.55) 0%,
        rgba(13, 8, 24, 0.85) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Navigation Top Bar */
    .nav-header {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(16, 12, 28, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .back-btn:hover {
      background: rgba(241, 67, 162, 0.25);
      border-color: var(--vice-pink);
      transform: translateX(-2px);
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .nav-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.65rem;
      letter-spacing: 2.5px;
      background: linear-gradient(90deg, #ffffff 25%, var(--vice-coral) 70%, var(--vice-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-spacer {
      width: 78px;
    }

    /* Main Content Container */
    .settings-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 28px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    .launcher-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .app-badge {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      padding: 3px;
      background: linear-gradient(135deg, var(--vice-sunset), var(--vice-pink), var(--vice-purple));
      box-shadow: 0 8px 24px rgba(241, 67, 162, 0.45);
    }

    .app-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      background-color: #161026;
      display: block;
    }

    .launcher-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 3px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .launcher-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }

    /* Info Group Card */
    .section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      padding-left: 6px;
      margin-bottom: -14px;
    }

    .settings-card {
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      font-family: 'Montserrat', sans-serif;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-key {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .setting-value {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--vice-coral);
      text-align: right;
    }

    .setting-value.badge {
      background: rgba(241, 67, 162, 0.2);
      border: 1px solid rgba(241, 67, 162, 0.55);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
    }

    .developer-link {
      color: var(--vice-cyan);
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .developer-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .footer {
      margin-top: auto;
      text-align: center;
      padding-top: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
  <script src="scripts/notch.js" defer></script>
</head>
<body>

  <img id="wallpaper-img" src="assets/wallpaper.png" alt="LinkSeed wallpaper" />
  <div class="screen-vignette"></div>

  <nav class="nav-header">
    <a href="index.html" class="back-btn" aria-label="Back to Launcher">
      <span>&#8592;</span>
      <span>Back</span>
    </a>
    <span class="nav-title">SETTINGS</span>
    <div class="nav-spacer"></div>
  </nav>

  <main class="settings-container">
    <div class="launcher-brand">
      <div class="app-badge">
        <img src="profiles/mayonaise/avatar.png" alt="LinkSeed Icon" onerror="this.src='assets/favicon.png'" />
      </div>
      <h1 class="launcher-name">LINKSEED LAUNCHER</h1>
      <p class="launcher-tagline">Mobile Web App Launcher</p>
    </div>

    <div class="section-label">About Launcher</div>
    <section class="settings-card" aria-label="Launcher Information">
      <div class="setting-row">
        <span class="setting-key">Version</span>
        <span class="setting-value badge" id="app-version">v1.0.0</span>
      </div>
      <div class="setting-row">
        <span class="setting-key">Developer</span>
        <span class="setting-value">
          <a href="https://yaktenz.github.io/mayonaise.gg" target="_blank" rel="noopener noreferrer" class="developer-link" id="app-developer">MAYONAISE GAMING</a>
        </span>
      </div>
      <div class="setting-row">
        <span class="setting-key">Last Update</span>
        <span class="setting-value" id="app-last-update">November 24, 2026</span>
      </div>
    </section>

    <footer class="footer">
      <span>LINKSEED</span>
    </footer>
  </main>

  <script>
    const LAUNCHER_INFO = {
      version: "v1.0.0",
      developer: "MAYONAISE GAMING",
      developerUrl: "https://yaktenz.github.io/mayonaise.gg",
      lastUpdate: "November 24, 2026"
    };

    document.getElementById("app-version").textContent = LAUNCHER_INFO.version;
    const devEl = document.getElementById("app-developer");
    devEl.textContent = LAUNCHER_INFO.developer;
    devEl.href = LAUNCHER_INFO.developerUrl;
    document.getElementById("app-last-update").textContent = LAUNCHER_INFO.lastUpdate;

  </script>
</body>
</html>
